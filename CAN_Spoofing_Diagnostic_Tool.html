<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAN Bus Spoofing Diagnostic Tool</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: auto; }
        textarea { width: 100%; height: 200px; }
        .btn { padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer; }
        .btn:hover { background: #0056b3; }
        #results { margin-top: 20px; border: 1px solid #ccc; padding: 10px; background: #f9f9f9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CAN Bus Spoofing Diagnostic Tool</h1>
        <p>Analyze CAN logs to detect spoofed messages (timing anomalies, high frequency injection).</p>
        <textarea id="logInput" placeholder="Paste CAN log here... (Format: Timestamp ID DLC Data)"></textarea><br><br>
        <button class="btn" onclick="analyzeLog()">Analyze Log</button>
        <button class="btn" onclick="loadDemo()">Load Demo Data</button>
        
        <div id="results">
            <h3>Analysis Results</h3>
            <p id="output">Waiting for input...</p>
        </div>
    </div>
    <script>
        function loadDemo() {
            document.getElementById('logInput').value = "0.001 100 8 FF FF FF FF FF FF FF FF\n0.010 100 8 FF FF FF FF FF FF FF FF\n0.011 100 8 00 00 00 00 00 00 00 00\n0.012 100 8 00 00 00 00 00 00 00 00\n0.020 100 8 FF FF FF FF FF FF FF FF";
        }
        function analyzeLog() {
            const lines = document.getElementById('logInput').value.split('\n');
            let output = "<ul>";
            let lastTime = {};
            let anomalies = 0;
            lines.forEach((line, i) => {
                const parts = line.trim().split(/\s+/);
                if(parts.length >= 3) {
                    const time = parseFloat(parts[0]);
                    const id = parts[1];
                    if(lastTime[id] !== undefined) {
                        const delta = time - lastTime[id];
                        // 5ms threshold is used here as a standard check for high-frequency spoofing.
                        // Can be made configurable in future iterations.
                        if (delta < 0.005) {
                            output += `<li><span style="color:red">Anomaly detected</span> at ${time}s: Message ${id} arrived too fast (delta: ${delta.toFixed(4)}s)</li>`;
                            anomalies++;
                        }
                    }
                    lastTime[id] = time;
                }
            });
            if(anomalies === 0 && lines.length > 1) {
                output += "<li>No anomalies detected.</li>";
            } else if (lines.length <= 1) {
                output += "<li>Invalid log format or empty.</li>";
            }
            output += "</ul>";
            document.getElementById('output').innerHTML = output;
        }
    </script>
</body>
</html>
